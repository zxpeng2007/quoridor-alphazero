[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quoridor-az"
version = "0.1.0"
description = "AlphaZero-style engine for Quoridor / barricade.gg"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "numba>=0.60",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["quoridor*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
